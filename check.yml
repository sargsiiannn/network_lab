name: TagLink Linux checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev openssl iproute2 ethtool tcpdump python3
          make test
          sudo make integration
